<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Password Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crt-overlay"></div>
    <div class="container-jogo">
        <div class="painel-arcade">
            <h1 class="titulo-pixel">CYBER HACKER</h1>
            <p class="subtitulo">Gere a senha perfeita para passar de fase!</p>

            <div class="painel-status-jogo">
                <div class="stat-box">FASE: <span id="val-fase">1</span></div>
                <div class="stat-box">SCORE: <span id="val-score">0000</span></div>
                <div class="stat-box">VIDAS: <span id="val-vidas">❤️❤️❤️</span></div>
            </div>

            <!-- Tela Estilo Arcade CRT -->
            <div class="tela-display">
                <div id="display-senha" class="texto-senha">PRESS START</div>
            </div>

            <!-- Controles do Jogo -->
            <div class="controles">
                <div class="painel-opcoes">
                    <label class="btn-toggle">
                        <input type="checkbox" id="chk-maiusculas" checked>
                        <span class="slider"></span> ABC (MAIÚSCULAS)
                    </label>
                    <label class="btn-toggle">
                        <input type="checkbox" id="chk-numeros" checked>
                        <span class="slider"></span> 123 (NÚMEROS)
                    </label>
                    <label class="btn-toggle">
                        <input type="checkbox" id="chk-simbolos">
                        <span class="slider"></span> #$% (SÍMBOLOS)
                    </label>
                </div>

                <div class="seletor-tamanho">
                    <span>TAMANHO: <b id="valor-tamanho">8</b></span>
                    <input type="range" id="range-tamanho" min="4" max="16" value="8">
                </div>

                <div class="botoes-acao">
                    <button id="btn-gerar" class="btn-arcade btn-verde">GERAR SENHA</button>
                    <button id="btn-hackear" class="btn-arcade btn-vermelho">TESTAR SENHA</button>
                </div>
            </div>

            <!-- Tela de Game Over / Sucesso -->
            <div id="overlay-status" class="overlay escondido">
                <h2 id="texto-status">GAME OVER</h2>
                <p id="mensagem-status">Senha muito fraca! O sistema detectou a invasão.</p>
                <button id="btn-reiniciar" class="btn-arcade btn-amarelo">TRY AGAIN 🔁</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
